[package]
name = "cubutt-native"
version = "0.1.1"
edition = "2021"

[dependencies]
buttplug = { version = "9.0.9", features = ["client", "websockets", "tokio-runtime"], default-features = false }
clap = { version = "4.5.2", features = ["derive"] }
miette = { version = "7.2.0", features = ["fancy"] }
nix = { version = "0.31.2", features = ["fs"] }
tokio = { version = "1.36.0", features = ["net", "rt", "macros", "rt-multi-thread", "fs"] }
tracing-subscriber = "0.3.18"
